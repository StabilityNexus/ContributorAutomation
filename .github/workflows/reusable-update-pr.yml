# Reusable workflow: Update contributor PR count for existing contributors
name: Update Contributor PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      repo_name:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      pr_author:
        description: 'PR author username'
        required: true
        type: string
      pr_title:
        description: 'PR title'
        required: true
        type: string
      lines_changed:
        description: 'Total lines changed'
        required: true
        type: number
    secrets:
      GIST_PAT:
        required: true

jobs:
  update_pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: StabilityNexus/ContributorAutomation
          path: automation
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r automation/requirements.txt
      
      - name: Check if contributor exists
        id: check
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          PR_AUTHOR: ${{ inputs.pr_author }}
        run: |
          cd automation
          python scripts/contributor_manager.py \
            --action check_exists \
            --username "$PR_AUTHOR" \
            --gist-pat "$GIST_PAT" \
            --output-file ../check_result.json
          
          if [ -f ../check_result.json ]; then
            EXISTS=$(jq -r '.exists' ../check_result.json)
            echo "exists=$EXISTS" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Configure Git
        if: steps.check.outputs.exists == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
      
      - name: Get PR labels
        if: steps.check.outputs.exists == 'true'
        id: labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER, 10)
            });
            return JSON.stringify(pr.labels.map(l => l.name));
      
      - name: Add PR to contributor
        if: steps.check.outputs.exists == 'true'
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_NAME: ${{ inputs.repo_name }}
          PR_TITLE: ${{ inputs.pr_title }}
          LINES_CHANGED: ${{ inputs.lines_changed }}
          PR_LABELS: ${{ steps.labels.outputs.result }}
        run: |
          cd automation
          python scripts/contributor_manager.py \
            --action add_pr \
            --username "$PR_AUTHOR" \
            --pr-number "$PR_NUMBER" \
            --repo-name "$REPO_NAME" \
            --pr-title "$PR_TITLE" \
            --lines-changed "$LINES_CHANGED" \
            --labels "$PR_LABELS" \
            --gist-pat "$GIST_PAT"
      
      - name: Not onboarded
        if: steps.check.outputs.exists == 'false'
        run: echo "Contributor not yet onboarded"